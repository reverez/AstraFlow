name: CPU verification
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-cpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DASTRAFLOW_ENABLE_CUDA=OFF
      - run: cmake --build build-cpu --parallel 2
      - run: ctest --test-dir build-cpu --output-on-failure
