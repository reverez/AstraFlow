name: CPU verification
on: [push, pull_request]
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: git ls-files '*.cpp' '*.hpp' '*.cu' '*.cuh' | xargs clang-format --dry-run -Werror
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements-analysis.txt
      - run: cmake -S . -B build-cpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DASTRAFLOW_ENABLE_CUDA=OFF -DASTRAFLOW_BUILD_BENCHMARKS=ON
      - run: cmake --build build-cpu --parallel 2
      - run: ctest --test-dir build-cpu --output-on-failure
      - run: ./build-cpu/astraflow_cli --config examples/sod/config.json --output runs/ci-sod && .venv/bin/python scripts/check_run.py runs/ci-sod
