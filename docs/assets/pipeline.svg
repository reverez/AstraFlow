 stroke="#86b6ef" stroke-width="1.5" marker-end="url(#a)"/><rect x="869" y="49" width="150" height="92" rx="12" fill="#1c5cab" fill-opacity="0.45" stroke="#86b6ef" stroke-width="1.2"/><text x="944" y="83" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#f0efec">SSP-RK2 update</text><text x="944" y="103" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#c3c2b7">two stages, or local</text><text x="944" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#c3c2b7">pseudo-time</text><line x1="1022" y1="95" x2="1038" y2="95" stroke="#86b6ef" stroke-width="1.5" marker-end="url(#a)"/><rect x="1041" y="49" width="150" height="92" rx="12" fill="#1c5cab" fill-opacity="0.45" stroke="#86b6ef" stroke-width="1.2"/><text x="1116" y="83" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#f0efec">Diagnostics</text><text x="1116" y="103" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#c3c2b7">residual RMS, boundary</text><text x="1116" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#c3c2b7">mass flux, one</text><text x="1116" y="133" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#c3c2b7">transfer</text><text x="600" y="178" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781">One timestep of the shared header-only operator; CPU and CUDA call the same functions and differ only in scheduling and memory</text></svg>
